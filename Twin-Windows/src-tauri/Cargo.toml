[package]
name = "twin"
version = "1.1.5"
description = "Twin – Windows Google Drive sync"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "twin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify-debouncer-full = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "json"] }
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
globset = "0.4"
md-5 = "0.10"
blake3 = "1"
flate2 = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
rfd = "0.15"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
proptest = "1"
serial_test = "3"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

