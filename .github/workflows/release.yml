name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: Twin-Windows/src-tauri

      - name: Install Frontend Dependencies
        working-directory: Twin-Windows
        run: pnpm install --no-frozen-lockfile

      - name: Pre-cache NSIS and Tauri Plugins
        shell: pwsh
        run: |
          $nsisDir = "$env:LOCALAPPDATA\tauri\NSIS"
          if (-not (Test-Path $nsisDir)) {
            New-Item -ItemType Directory -Path $nsisDir -Force | Out-Null
          }
          
          # 1. Download and extract NSIS 3.13 toolset
          $makensis = Join-Path $nsisDir "makensis.exe"
          if (-not (Test-Path $makensis)) {
            Write-Host "Downloading NSIS 3.13 from SourceForge mirror..."
            $tempZip = Join-Path $env:TEMP "nsis-3.13.zip"
            curl.exe -L -s -o $tempZip "https://sourceforge.net/projects/nsis/files/NSIS%203/3.13/nsis-3.13.zip/download"
            Expand-Archive -Path $tempZip -DestinationPath $env:TEMP -Force
            $extractedDir = Join-Path $env:TEMP "nsis-3.13"
            Copy-Item -Path "$extractedDir\*" -Destination $nsisDir -Recurse -Force
            Copy-Item -Path $tempZip -Destination $nsisDir -Force
            Remove-Item -Path $tempZip, $extractedDir -Recurse -Force
            Write-Host "NSIS 3.13 extracted to $nsisDir"
          }

          # 2. Download and place nsis_tauri_utils.dll via direct GitHub API asset endpoint
          $pluginsDir = Join-Path $nsisDir "Plugins\x86-unicode\additional"
          if (-not (Test-Path $pluginsDir)) {
            New-Item -ItemType Directory -Path $pluginsDir -Force | Out-Null
          }
          $pluginDll = Join-Path $pluginsDir "nsis_tauri_utils.dll"
          if (-not (Test-Path $pluginDll)) {
            Write-Host "Downloading nsis_tauri_utils.dll via GitHub API..."
            curl.exe -s -L -H "Accept: application/octet-stream" -H "User-Agent: TauriCI" -o $pluginDll "https://api.github.com/repos/tauri-apps/nsis-tauri-utils/releases/assets/345882097"
            $hash = (Get-FileHash -Path $pluginDll -Algorithm SHA1).Hash
            Write-Host "nsis_tauri_utils.dll installed with SHA1: $hash"
          }

      - name: Build Tauri Desktop Application
        working-directory: Twin-Windows
        run: pnpm tauri build --bundles nsis

      - name: Stage Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release_assets" -Force
          
          # Standalone executable
          $srcExe = Get-ChildItem -Path "Twin-Windows/src-tauri/target/release" -Filter "*.exe" -Depth 0 -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if ($srcExe -and (Test-Path $srcExe)) {
            Copy-Item $srcExe "release_assets/Twin.exe"
            Compress-Archive -Path "release_assets/Twin.exe", "README.md", "LICENSE" -DestinationPath "release_assets/Twin-Windows-Portable.zip" -Force
          }
          
          # Bundle installers (NSIS / MSI)
          Get-ChildItem -Path "Twin-Windows/src-tauri/target/release/bundle" -Recurse -Include "*.exe","*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "release_assets/"
          }
          
          # Checksums
          Get-ChildItem -Path "release_assets" -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "release_assets/SHA256SUMS.txt" -Append -Encoding ascii
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Twin ${{ github.ref_name }}
          body_path: release-notes.md
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
